# ---------------------------------------------------------------------------
# HYBRID design  =  engineeringclassic (base you liked)
#                 + Raleway font        (already the engineeringclassic default)
#                 + opal's teal-green colour palette
#                 + narrower margins
#                 + harvard's experience-entry layout & spacing
#
# A RenderCV theme is just a *preset* of design settings. Setting `theme:` loads
# that preset, and every key below OVERRIDES one preset value (RenderCV
# deep-merges these deltas onto the theme). So you are never locked into a
# single theme — you cherry-pick settings from several. Only the deltas vs
# engineeringclassic are listed here; everything else is inherited from it.
# ---------------------------------------------------------------------------
design:
  theme: engineeringclassic          # base look (full-line section titles, Raleway)

  typography:
    font_family:                     # Raleway everywhere (engineeringclassic default, pinned explicitly)
      body: Raleway
      name: Raleway
      headline: Raleway
      connections: Raleway
      section_titles: Raleway
    bold:
      name: false
      section_titles: false
    font_size:
      name: 21pt                     # SMALLER name (RenderCV default is 30pt)

  header:
    alignment: left
    space_below_name: 0.6cm          # near the 0.7cm original, trimmed only slightly
    space_below_headline: 0.55cm     # (previous 0.08cm/0.15cm was far too cramped)
    space_below_connections: 0.5cm

  page:                              # NARROWER: 0.4in all sides (default 0.7in; was 0.5in)
    top_margin: 0.4in
    bottom_margin: 0.4in
    left_margin: 0.4in
    right_margin: 0.4in
    show_top_note: false             # hide the "Last updated in ..." line
    show_footer: false               # hide the "Name - page N" footer

  colors:                            # opal's teal-green palette (rgb 0-255)
    name: rgb(0, 100, 90)
    headline: rgb(0, 80, 72)
    connections: rgb(0, 80, 72)
    section_titles: rgb(0, 100, 90)
    links: rgb(0, 100, 90)

  sections:
    space_between_regular_entries: 1em   # harvard's tighter gap between jobs (vs 1.2em)

  entries:
    short_second_row: false              # keep the date on its own row (engineeringclassic setting)
    summary:
      space_above: 0cm                   # harvard/base spacing (engineeringclassic uses 0.12cm)
    highlights:
      space_left: 0.15cm                 # harvard/base: a small bullet indent
      space_above: 0cm
      space_between_items: 0cm           # harvard/base: tighter bullets

  templates:
    time_span: ""                        # harvard: no duration badge next to dates
    experience_entry:
      # harvard order: COMPANY bold first, then position. LOCATION removed per request.
      main_column: "**COMPANY**, POSITION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
