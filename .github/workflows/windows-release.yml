name: Windows desktop release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  quality:
    name: Quality (${{ matrix.check }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [style, types]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/windows/requirements.txt
      - name: Install pinned desktop build and development tools
        run: |
          python -m pip install -r packaging\windows\requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install -e ".[dev,dashboard]"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Lint and formatting
        if: matrix.check == 'style'
        run: |
          python -m ruff check linkedin_easy_apply tests tools packaging apply.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m black --check linkedin_easy_apply tests tools\windows\build_windows.py tools\windows\smoke_windows.py tools\media\capture_screenshots.py tools\todo_sync.py packaging\windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Type checking
        if: matrix.check == 'types'
        run: python -m mypy linkedin_easy_apply

  tests:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.suite }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        python: ["3.12", "3.13"]
        suite: [core, automation, desktop, dashboard, tooling]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/windows/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r packaging\windows\requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install -e ".[dev,dashboard]"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install isolated browser fixtures
        if: matrix.suite == 'automation'
        run: python -m playwright install chromium
      - name: Run fictional offline tests
        env:
          LEA_REQUIRE_INVITATION_BROWSER_TESTS: "1"
        run: >-
          python -m pytest "tests\${{ matrix.suite }}" -n 2 --dist loadfile
          --junitxml=test-results\junit.xml --cov=linkedin_easy_apply
          --cov-report=xml:test-results\coverage.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-py${{ matrix.python }}-${{ matrix.suite }}-${{ github.sha }}
          path: test-results/*.xml
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Frozen Windows build and smoke
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/windows/requirements.txt
      - name: Install pinned desktop build
        run: |
          python -m pip install -r packaging\windows\requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --no-deps .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify tag and package version
        run: |
          $version = python -c "from linkedin_easy_apply import __version__; print(__version__)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag does not match package version $version"
          }
          if (-not (Test-Path "docs\releases\v$version.md")) {
            throw "Release notes are missing for $version"
          }
      - name: Build Windows distribution
        run: python tools\windows\build_windows.py --source-commit "$env:GITHUB_SHA"
      - name: Exercise frozen executables offline
        run: python tools\windows\smoke_windows.py dist\windows\EasyApplyAutomaton
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ github.sha }}
          path: |
            dist/windows/*.zip
            dist/windows/*.manifest.json
            dist/windows/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  qualify:
    name: qualify
    if: always()
    needs: [quality, tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every qualification lane
        shell: python
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          import json
          import os

          results = json.loads(os.environ["NEEDS_JSON"])
          if set(results) != {"quality", "tests", "build"}:
              raise SystemExit("Incomplete qualification results were received.")
          failed = [f"{name}: {job['result']}" for name, job in results.items()
                    if job["result"] != "success"]
          if failed:
              raise SystemExit("Qualification failed: " + ", ".join(failed))
          print("Every quality, test and frozen-build lane passed.")

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-${{ github.sha }}
          path: release
      - name: Verify downloaded release checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish verified Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag \
            --title "Easy Apply Automaton $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" --latest
