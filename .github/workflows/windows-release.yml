name: Windows desktop release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packaging/windows/requirements.txt
      - name: Install pinned desktop build and development tools
        run: |
          python -m pip install -r packaging\windows\requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify tag and package version
        shell: pwsh
        run: |
          $version = python -c "from linkedin_easy_apply import __version__; print(__version__)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag does not match package version $version"
          }
      - name: Quality gates
        run: |
          python -m ruff check .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m black --check linkedin_easy_apply tests tools\build_windows.py tools\smoke_windows.py tools\capture_screenshots.py tools\todo_sync.py packaging\windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m mypy linkedin_easy_apply
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pytest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows distribution
        run: python tools\build_windows.py --source-commit "$env:GITHUB_SHA"
      - name: Exercise frozen executables offline
        run: python tools\smoke_windows.py dist\windows\EasyApplyAutomaton
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ github.sha }}
          path: |
            dist/windows/*.zip
            dist/windows/*.manifest.json
            dist/windows/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-${{ github.sha }}
          path: release
      - name: Publish verified Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag \
            --title "Easy Apply Automaton $RELEASE_TAG" \
            --notes "Portable Windows x64 desktop and CLI. Extract the entire ZIP and run EasyApplyAutomaton.exe. Python is included; use installed Edge/Chrome or install Chromium separately. Private settings remain in %LOCALAPPDATA%\EasyApplyAutomaton. Unsigned binaries may trigger SmartScreen. Includes SHA256SUMS and a per-file build manifest. Streamlit/OpenAI remain source extras; dynamic resume building needs an external builder/Python. Offline checks do not imply fresh-machine or live LinkedIn qualification."
