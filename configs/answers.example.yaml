# Example answers file. Copy to configs/answers.yaml and fill in YOUR details.
# Values here are used to auto-fill Easy Apply questions. Nothing is uploaded
# anywhere; this file stays on your machine.

# --- Personal / contact -----------------------------------------------------
full_name: Jane Doe
first_name: Jane
last_name: Doe
email: jane.doe@example.com
phone: "+91-9000000000"
# Phone country code dropdown. Match the option label LinkedIn shows, e.g.
# "India (+91)". If omitted the tool defaults to +91 and only pauses to ask
# when the portal is pre-set to a DIFFERENT country code.
phone_country_code: India (+91)
city: Bengaluru
country: India
linkedin: https://www.linkedin.com/in/jane-doe
github: https://github.com/janedoe
portfolio: https://janedoe.dev
website: https://janedoe.dev

# --- Preferences ------------------------------------------------------------
years_experience: 8            # total years of professional experience
notice_period: 45 days         # free-text form (used for most notice questions)
notice_period_days: 45         # numeric-only, for "notice period in days" questions
# Salary/CTC figures are the ANNUAL amount as a plain integer (no commas, no
# currency). "amount in INR" questions get just the number (no commas).
current_ctc: 3000000           # e.g. 30 LPA INR
# Expected CTC is chosen by the role's seniority tier (detected from the job
# title): SDE 3 / senior+ gets the ceiling, SDE 1 / junior the floor. When the
# level can't be inferred the tool defaults to the SDE 1 band.
expected_ctc_sde1: 3200000     # SDE 1 / junior  (e.g. 32 LPA) - also the default
expected_ctc_sde2: 3500000     # SDE 2 / mid     (e.g. 35 LPA)
expected_ctc_sde3: 4000000     # SDE 3 / senior+ (e.g. 40 LPA, the ceiling)
expected_ctc: 3200000          # fallback if a tier key above is missing
# A MONTHLY salary question divides the annual figure by 12: expected salary is
# rounded to the nearest 100,000, current salary to the nearest 10,000. To pin an
# exact monthly figure per tier instead, set expected_ctc_monthly_<tier> (these
# override the division for expected-salary "monthly" questions):
expected_ctc_monthly_sde1: 300000   # SDE 1 monthly
expected_ctc_monthly_sde2: 320000   # SDE 2 monthly
expected_ctc_monthly_sde3: 340000   # SDE 3 monthly
current_salary: 3000000        # annual fallback if current_ctc is unset
expected_salary: 3200000       # annual fallback if the expected_ctc keys are unset
start_date: 2 weeks
education: Bachelor's Degree

# Yes/No questions (accepts true/false or yes/no)
authorization: true            # legally authorized to work
visa: false                    # require visa sponsorship?
relocation: true               # willing to relocate
remote: true                   # comfortable working remotely
onsite: true                   # comfortable working onsite

# Equal-opportunity questions (optional; "Decline" is a safe default)
gender: Decline to answer
race: Decline to answer
veteran: I am not a protected veteran
disability: I don't wish to answer

# Free-text used by the cover-letter template
summary: >
  I build reliable, scalable backend services and enjoy owning systems
  end-to-end, from design through production operations.

# --- Skills (years of experience) -------------------------------------------
# Aliases let one entry answer differently phrased questions, e.g. "Core Java".
skills:
  Java:
    years: 6
    aliases: [Core Java, Java Programming, J2EE]
  Python:
    years: 5
    aliases: [Py]
  Kubernetes:
    years: 4
    aliases: [K8s]
  Azure:
    years: 5
    aliases: [Microsoft Azure]
  SQL:
    years: 7
  Docker:
    years: 5

# --- Field aliases ----------------------------------------------------------
# Map an alternate label to a canonical field above.
aliases:
  mobile: phone
  cell: phone
  personal email: email
  expected compensation: expected_ctc
  current compensation: current_ctc

# --- Defaults for anything not explicitly answered --------------------------
defaults:
  authorization: true
  relocation: true
  remote: true
