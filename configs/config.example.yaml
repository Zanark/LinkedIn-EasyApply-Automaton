# LinkedIn Easy Apply Automaton - example configuration.
# Copy to configs/config.yaml (or run `lea init`) and edit for your setup.
# String values support ${ENV_VAR} and ${ENV_VAR:-default} expansion.

browser:
  engine: edge                   # edge | chrome | chromium
  # Path to a browser profile that is ALREADY logged into LinkedIn.
  # Windows Edge example: C:/Users/<you>/AppData/Local/Microsoft/Edge/User Data
  # Tip: use a dedicated profile and close other windows using it first.
  profile_path: ${LEA_PROFILE:-.browser-profile}
  headless: false                # keep visible so you can intervene
  viewport_width: 1440
  viewport_height: 900
  slow_mo_ms: 0
  download_dir: downloads
  accept_downloads: false        # decline browser downloads (LinkedIn's resume
                                 # preview is re-served as a PDF attachment); set
                                 # true only if you actually need saved downloads
  default_timeout_ms: 30000
  navigation_timeout_ms: 45000
  max_retries: 3
  record_har: false

jobs:
  max_per_run: 15
  max_per_company: 3
  max_daily: 40
  pause_after: 5                 # pause after every N applications (0 disables)
  pause_seconds: 20
  blacklist_companies: []
  whitelist_companies: []
  include_keywords: []           # if set, job text must contain at least one
  exclude_keywords:              # skip jobs mentioning any of these
    - clearance
    - unpaid

search:
  searches:
    - name: backend
      url: "https://www.linkedin.com/jobs/search/?keywords=backend%20engineer&f_AL=true"
      enabled: true
    - name: sre
      url: "https://www.linkedin.com/jobs/search/?keywords=site%20reliability%20engineer&f_AL=true"
      enabled: false

answers:
  file: configs/answers.yaml
  fuzzy_threshold: 80

resume:
  directory: generated/resume
  default: Backend.pdf
  mapping:
    backend engineer: Backend.pdf
    java developer: Java.pdf
    site reliability engineer: SRE.pdf
    azure: Azure.pdf

  # Optional. Path to your master.yaml (résumé source of truth) used by the
  # "Resume match" dashboard tab and `lea sync-answers` to grade submitted
  # answers against your real experience. If unset, it is auto-located at
  # <builder.path>/master.yaml (below), then configs/master.yaml.
  # master_path: C:\path\to\dynamic-resume-builder\master.yaml

  # --- Optional: per-job dynamic resume generation --------------------------
  # OFF by default. When enabled, the automaton asks the *separate*
  # dynamic-resume-builder tool (github.com/Zanark/dynamic-resume-builder) to
  # render a resume tailored to each job right before applying - e.g. an
  # AI-heavy posting surfaces your "Data & AI" skills first under an AI headline.
  # It only re-emphasises existing content from the builder's master.yaml; it
  # NEVER invents experience. Falls back to the static mapping/default above on
  # no match or any error. (Requires downloading the builder tool separately.)
  builder:
    enabled: false
    path: C:\path\to\dynamic-resume-builder    # folder holding render.py + master.yaml
    # python: C:\path\to\python.exe            # optional; defaults to this tool's own
    design: SeafoamTide-Light # builder HTML design for tailored resumes (e.g. SeafoamTide-Light | SeafoamBubbles-Light | focus)
    mode: keyword             # keyword (offline) | ai (needs ai.enabled + OPENAI_API_KEY)
    ai_fallback_keyword: true # in ai mode, fall back to keyword clusters if the model abstains
    cache: true               # render each cluster at most once per run
    timeout: 180              # seconds to wait for a render
    title_weight: 3           # a keyword hit in the job TITLE counts this much (vs 1 in body)
    min_score: 1              # minimum weighted keyword hits before tailoring kicks in
    # Each cluster maps job keywords -> a resume emphasis. The skills_order names
    # MUST match the `category:` names in the builder's master.yaml exactly.
    clusters:
      - key: ai
        keywords: [ai, ml, machine learning, llm, genai, nlp, data science]
        title: AI / ML Engineer
        skills_order: [Data & AI, Cloud & DevOps, Backend]
        compact: true
        condense_older: true
        include_awards: false
      - key: backend
        keywords: [backend, back-end, microservices, api, distributed systems]
        title: Backend Engineer
        skills_order: [Backend, Cloud & DevOps, Reliability]
        compact: true
        condense_older: true
        include_awards: false
      - key: sre
        keywords: [sre, site reliability, observability, on-call, incident]
        title: Site Reliability Engineer
        skills_order: [Reliability, Cloud & DevOps, Automation]
        compact: true
        condense_older: true
        include_awards: false

scoring:
  threshold: 20
  case_sensitive: false
  rules:
    - { keyword: backend, weight: 20 }
    - { keyword: azure, weight: 20 }
    - { keyword: distributed systems, weight: 15 }
    - { keyword: kubernetes, weight: 10 }
    - { keyword: java, weight: 10 }
    - { keyword: go, weight: 5 }
    - { keyword: remote, weight: 5 }
    - { keyword: principal, weight: -50 }
    - { keyword: staff, weight: -40 }
    - { keyword: rust, weight: -30 }

logging:
  level: INFO                    # DEBUG narrates every field decision & data lookup;
                                 # INFO shows per-field outcomes; use WARNING for quiet runs.
                                 # Tip: pass -v / --verbose on any command to force DEBUG.
  directory: logs
  rotation: 10 MB
  retention: 14 days
  console: true

ai:
  provider: none                 # none | openai
  enabled: false
  model: gpt-4o-mini
  api_key_env: OPENAI_API_KEY
  temperature: 0.2
  max_tokens: 800

database:
  path: database/easy_apply.db

screenshots:
  enabled: true
  directory: screenshots
  on_error: true
  each_step: true
  # Delete step/unknown screenshots at the end of a run, keeping only the ones
  # referenced by an application record (e.g. after-submit evidence). Set to
  # false to keep every screenshot for debugging.
  cleanup: true

run:
  dry_run: false
  # interactive: confirm each final submit in the terminal (prompt defaults to
  # Yes, so Enter submits). false = submit automatically. The --confirm-submit /
  # --no-confirm-submit CLI flag overrides this per run.
  interactive: false
  pause_on_unknown_question: true
  # Seconds to pause after logging the chosen resume so you can read which
  # resume was picked before the application starts. Set to 0 to disable.
  resume_review_pause: 3.0

# After a successful application, handle the "Meet the hiring team" recruiters.
# In the default `draft` mode the tool reads each recruiter's name + LinkedIn
# profile URL from the page, drafts a full message AND a short <=300-char
# connection note (for the free invitation), and writes a plain-text report to
# `report_dir` at the end of the run for you to send by hand -- it clicks nothing
# and runs fully unattended (even under --yes).
# Set `mode: send` to instead pause for approval and send each message on
# LinkedIn (needs an interactive run; falls back to `draft` under --yes).
# The --message-hiring-team / --no-message-hiring-team CLI flag overrides `enabled`.
outreach:
  enabled: true           # collect contacts + draft messages + write the report
  mode: draft             # draft (report only, no clicking) | send (message on LinkedIn)
  max_per_run: 5          # safety cap on contacts handled per run
  # template: path/to/message.j2   # optional custom Jinja2 full-message template
  # note_template: path/to/note.j2 # optional custom Jinja2 note template (<=300 chars)
  skip_if_messaged: true  # never contact the same person twice
  report_dir: generated/outreach   # where the plain-text report is written
